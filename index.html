<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animales en Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      font-family: Arial, sans-serif; 
    }
    model-viewer { 
      width: 100%; 
      height: 100%; 
      background-color: #ededed; 
    }

    /* Botón para iniciar la cámara */
    #btn-ar-custom {
      position: fixed; 
      bottom: 30px; 
      left: 50%; 
      transform: translateX(-50%);
      padding: 16px 28px; 
      background-color: #1b5e20; 
      color: #ffffff; 
      border: none;
      border-radius: 30px; 
      font-size: 16px; 
      font-weight: bold; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      cursor: pointer;
      z-index: 10000;
    }

    /* Disparador estilo obturador fotográfico */
    #btn-captura {
      display: none;
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 74px;
      height: 74px;
      background-color: #ffffff;
      border: 6px solid #1b5e20;
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
      cursor: pointer;
      z-index: 10001;
      outline: none;
    }

    #btn-captura:active {
      transform: translateX(-50%) scale(0.9);
      background-color: #dcdcdc;
    }

    /* Efecto visual de flash fotográfico */
    #flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 20000;
      transition: opacity 0.08s ease-out;
    }

    .disparar-flash {
      opacity: 0.85 !important;
    }
  </style>
</head>
<body>

  <!-- Capa del destello de flash -->
  <div id="flash-overlay"></div>

  <!-- Visor 3D / AR -->
  <model-viewer 
    id="visor-animal"
    src="https://lexuni-design.github.io/Res-pilar/comadreja.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="auto"
    camera-controls 
    tone-mapping="neutral" 
    shadow-intensity="1">
  </model-viewer>

  <!-- Botones -->
  <button id="btn-ar-custom">
    📷 Ver en tu patio
  </button>

  <button id="btn-captura" title="Disparar obturador"></button>

  <script>
    const visor = document.getElementById('visor-animal');
    const btnAr = document.getElementById('btn-ar-custom');
    const btnCaptura = document.getElementById('btn-captura');
    const flash = document.getElementById('flash-overlay');

    // Inicializar el contexto de audio
    let audioCtx = null;

    function reproducirSonidoObturador() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const tiempo = audioCtx.currentTime;

      // 1. Ruido blanco para emular el golpe mecánico del espejo/cortina
      const bufferSize = audioCtx.sampleRate * 0.04;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(1400, tiempo);
      noiseFilter.Q.setValueAtTime(3, tiempo);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.8, tiempo);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, tiempo + 0.04);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(tiempo);

      // 2. Tono percusivo metálico secundario del clic
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, tiempo);
      osc.frequency.exponentialRampToValueAtTime(80, tiempo + 0.06);

      oscGain.gain.setValueAtTime(0.6, tiempo);
      oscGain.gain.exponentialRampToValueAtTime(0.01, tiempo + 0.06);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(tiempo);
      osc.stop(tiempo + 0.06);
    }

    // 1. Abrir Realidad Aumentada
    btnAr.addEventListener('click', async () => {
      // Activa el contexto de audio con la primera interacción del usuario
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      if (visor.canActivateAR) {
        visor.activateAR();
      } else {
        const glbUrl = encodeURIComponent("https://lexuni-design.github.io/Res-pilar/comadreja.glb");
        const title = encodeURIComponent("Comadreja");
        const fallbackUrl = encodeURIComponent(window.location.href);
        
        const sceneViewerIntent = `intent://arvr.google.com/scene-viewer/1.0?file=${glbUrl}&mode=ar_only&title=${title}&resizable=true#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${fallbackUrl};end;`;
        
        window.location.href = sceneViewerIntent;
      }
    });

    // 2. Alternar visibilidad de botones según el estado de AR
    visor.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'session-started') {
        btnAr.style.display = 'none';
        btnCaptura.style.display = 'block';
      } else if (event.detail.status === 'not-presenting') {
        btnAr.style.display = 'block';
        btnCaptura.style.display = 'none';
      }
    });

    // 3. Captura con sonido, destello háptico y descarga
    btnCaptura.addEventListener('click', async () => {
      // Efectos inmediatos al presionar
      reproducirSonidoObturador();

      // Vibración de cámara en Android (si el dispositivo lo soporta)
      if (navigator.vibrate) {
        navigator.vibrate(35);
      }

      // Animación de flash
      flash.classList.add('disparar-flash');
      setTimeout(() => {
        flash.classList.remove('disparar-flash');
      }, 90);

      // Captura y descarga del fotograma
      try {
        const blob = await visor.toBlob({ idealAspect: true });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `comadreja-ar-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('Error al capturar la imagen:', err);
      }
    });
  </script>

</body>
</html>
