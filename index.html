<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animales en Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      font-family: Arial, sans-serif; 
    }
    model-viewer { 
      width: 100%; 
      height: 100%; 
      background-color: #ededed; 
    }

    /* Botón para iniciar la cámara */
    #btn-ar-custom {
      position: fixed; 
      bottom: 30px; 
      left: 50%; 
      transform: translateX(-50%);
      padding: 16px 28px; 
      background-color: #1b5e20; 
      color: #ffffff; 
      border: none;
      border-radius: 30px; 
      font-size: 16px; 
      font-weight: bold; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      cursor: pointer;
      z-index: 10000;
    }

    /* Botón obturador de cámara (estilo disparador circular) */
    #btn-captura {
      display: none; /* Se activa solo cuando la cámara está funcionando */
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 70px;
      background-color: #ffffff;
      border: 5px solid #1b5e20;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      z-index: 10001;
    }

    #btn-captura:active {
      transform: translateX(-50%) scale(0.92);
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <model-viewer 
    id="visor-animal"
    src="https://lexuni-design.github.io/Res-pilar/comadreja.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="auto"
    camera-controls 
    tone-mapping="neutral" 
    shadow-intensity="1">
  </model-viewer>

  <!-- Botón 1: Iniciar AR -->
  <button id="btn-ar-custom">
    📷 Ver en tu patio
  </button>

  <!-- Botón 2: Disparador de foto -->
  <button id="btn-captura" title="Sacar foto"></button>

  <script>
    const visor = document.getElementById('visor-animal');
    const btnAr = document.getElementById('btn-ar-custom');
    const btnCaptura = document.getElementById('btn-captura');

    // 1. Abrir Realidad Aumentada
    btnAr.addEventListener('click', async () => {
      if (visor.canActivateAR) {
        visor.activateAR();
      } else {
        const glbUrl = encodeURIComponent("https://lexuni-design.github.io/Res-pilar/comadreja.glb");
        const title = encodeURIComponent("Comadreja");
        const fallbackUrl = encodeURIComponent(window.location.href);
        
        const sceneViewerIntent = `intent://arvr.google.com/scene-viewer/1.0?file=${glbUrl}&mode=ar_only&title=${title}&resizable=true#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${fallbackUrl};end;`;
        
        window.location.href = sceneViewerIntent;
      }
    });

    // 2. Detectar cuando la sesión de AR WebXR está activa en pantalla
    visor.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'session-started') {
        btnAr.style.display = 'none';
        btnCaptura.style.display = 'block';
      } else if (event.detail.status === 'not-presenting') {
        btnAr.style.display = 'block';
        btnCaptura.style.display = 'none';
      }
    });

    // 3. Tomar la foto y descargarla
    btnCaptura.addEventListener('click', async () => {
      // Captura el lienzo actual en formato blob
      const blob = await visor.toBlob({ idealAspect: true });
      const url = URL.createObjectURL(blob);
      
      // Crea un enlace invisible para descargar la foto automáticamente
      const a = document.createElement('a');
      a.href = url;
      a.download = `comadreja-ar-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
