<script>
  const catalogo = {
    "comadreja": {
      nombre: "Comadreja overa",
      glb: "https://lexuni-design.github.io/Res-pilar/comadreja.glb"
    },
    "lechu": {
      nombre: "Lechuza de campanario",
      glb: "https://lexuni-design.github.io/Res-pilar/lechu.glb"
    },
    "lechuza": {
      nombre: "Lechuza de campanario",
      glb: "https://lexuni-design.github.io/Res-pilar/lechu.glb"
    }
  };

  const params = new URLSearchParams(window.location.search);
  let rawParam = params.get('objeto') || params.get('animal');
  let idSeleccionado = rawParam ? rawParam.trim().toLowerCase() : null;

  if (!idSeleccionado || !catalogo[idSeleccionado]) {
    idSeleccionado = "comadreja";
  }

  const item = catalogo[idSeleccionado];

  const visor = document.getElementById('visor-modelo');
  const cartel = document.getElementById('cartel-nombre');
  const estado = document.getElementById('cartel-estado');
  const boton = document.getElementById('btn-ar-custom');

  cartel.textContent = item.nombre;
  document.title = `${item.nombre} - Realidad Aumentada`;

  estado.style.display = 'block';
  estado.textContent = `Descargando ${item.nombre}: 0%`;

  visor.src = item.glb;

  // Seguimiento del porcentaje real de descarga
  visor.addEventListener('progress', (event) => {
    const porcentaje = Math.round(event.detail.totalProgress * 100);
    estado.textContent = `Descargando ${item.nombre}: ${porcentaje}%`;
    if (porcentaje >= 100) {
      estado.textContent = 'Procesando modelo 3D...';
    }
  });

  visor.addEventListener('load', () => {
    estado.style.display = 'none';
  });

  visor.addEventListener('error', (detalle) => {
    estado.style.display = 'block';
    estado.style.backgroundColor = '#d32f2f';
    estado.textContent = `Error: no se pudo cargar ${item.glb.split('/').pop()}`;
    console.error('Error al cargar GLB:', detalle);
  });

  boton.addEventListener('click', () => {
    if (visor.canActivateAR) {
      visor.activateAR();
      return;
    }

    const glbUrl = encodeURIComponent(item.glb);
    const title = encodeURIComponent(item.nombre);
    const fallbackUrl = encodeURIComponent(window.location.href);
    
    window.location.href = `intent://arvr.google.com/scene-viewer/1.0?file=${glbUrl}&mode=ar_preferred&title=${title}&resizable=true#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${fallbackUrl};end;`;
  });
</script>
